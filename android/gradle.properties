# --- Low-memory / 8 GB RAM safe limits ---
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.workers.max=1
android.useAndroidX=true

# Compile Kotlin inside the Gradle daemon (no extra JVM/~1GB)
kotlin.compiler.execution.strategy=in-process
