name: invokhata
description: "An offline GST and Non-GST Billing and Khata App"
publish_to: 'none'
version: 1.0.0+2002

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Offline Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2

  # PDF & Thermal Printing
  pdf: ^3.12.0
  printing: ^5.14.3

  # Barcode Scanner & Utilities (Google ML Kit: CameraX + MLKit on Android,
  # AVFoundation + Apple Vision on iOS/macOS, ZXing on web)
  file_picker: ^8.1.7
  mobile_scanner: ^7.4.0
  intl: ^0.20.3
  uuid: ^4.3.3
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Isar Code Generator
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/invokhata_logo.png
